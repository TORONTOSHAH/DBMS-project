<!doctype html>
<html lang="ru"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Вход продавца</title><link rel="stylesheet" href="styles.css" /></head>
<body>
<header class="site-header"><div class="site-header-inner"><a class="site-brand" href="Приглашение.html"><span class="brand-mark">M</span><span>Management Feedback</span></a><nav class="site-nav"><a href="Приглашение.html">Главная</a><a href="buyer.html">Каталог</a><a href="database.html">Database</a></nav><form class="site-search" action="search.html" method="get"><input class="site-search-input" type="search" name="q" placeholder="Поиск товаров, продавцов, категорий" /><button class="button secondary site-search-button" type="submit">Найти</button></form><div class="site-actions"><details class="login-menu"><summary>Войти</summary><div class="login-menu-panel"><a href="buyer-login.html">Покупатель</a><a href="seller-login.html">Продавец</a><a href="admin-login.html">Админ</a></div></details></div></div></header>
<div class="center-shell"><div class="panel auth-card"><div class="stack"><div class="tag seller">Продавец</div><h1>Вход продавца</h1><div class="muted">После входа вы перейдете в отдельный кабинет продавца.</div><form id="loginForm"><label>Email<input name="email" type="email" placeholder="seller@platform.local" required /></label><label>Пароль<input name="password" type="password" placeholder="Введите пароль" required /></label><div class="hint">Демо-доступ: seller@platform.local / seller123</div><div id="errorBox" class="error-box hidden">Неверный логин или пароль продавца.</div><button class="primary" type="submit">Войти</button></form><a class="button secondary" href="Приглашение.html">Назад на главную</a></div></div></div>
<script src="app.js"></script><script>const state=loadState();const user=currentUser(state);if(user&&user.role==="seller"){window.location.href="seller.html";}document.getElementById("loginForm").addEventListener("submit",(event)=>{event.preventDefault();const ok=loginForRole(state,"seller",event.target.elements.email.value,event.target.elements.password.value);if(!ok){document.getElementById("errorBox").classList.remove("hidden");}});</script>
</body></html>
