<!doctype html>
<html lang="ru"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Оставить отзыв</title><link rel="stylesheet" href="styles.css" /></head>
<body>
<header class="site-header"><div class="site-header-inner"><a class="site-brand" href="Приглашение.html"><span class="brand-mark">M</span><span>Management Feedback</span></a><nav class="site-nav"><a href="Приглашение.html">Главная</a><a href="buyer.html">Каталог</a><a href="database.html">Database</a></nav><form class="site-search" action="search.html" method="get"><input class="site-search-input" type="search" name="q" placeholder="Поиск товаров, продавцов, категорий" /><button class="button secondary site-search-button" type="submit">Найти</button></form><div class="site-actions"><details class="login-menu"><summary>Войти</summary><div class="login-menu-panel"><a href="buyer-login.html">Покупатель</a><a href="seller-login.html">Продавец</a><a href="admin-login.html">Админ</a></div></details></div></div></header>
<div class="center-shell"><div class="panel auth-card"><div class="stack"><div class="nav"><div class="tag buyer">Отдельная страница отзыва</div><div class="actions"><div class="badge buyer" data-session-badge>Покупатель</div><button class="secondary" data-logout type="button">Выйти</button></div></div><h1>Оставить отзыв на товар</h1><div id="productSummary" class="hint"></div><form id="reviewForm"><label>Товар<select name="productId" required></select></label><label>Оценка<select name="rating" required><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></label><label>Отзыв<textarea name="message" placeholder="Опишите ваш опыт с товаром" required></textarea></label><div id="successBox" class="success-box hidden">Отзыв сохранен. Возвращаем вас в кабинет покупателя.</div><button class="primary" type="submit">Сохранить отзыв</button><a class="button secondary" href="buyer.html">Вернуться в кабинет покупателя</a></form></div></div></div>
<script src="app.js"></script><script>const state=loadState();const user=requireRole(state,"buyer");if(user){setupNav(state);const select=document.querySelector('[name="productId"]');const params=new URLSearchParams(window.location.search);const preselectedId=params.get("productId")||"";fillProductSelect(state,select,preselectedId);const productSummary=document.getElementById("productSummary");function updateSummary(){const product=productById(state,select.value);productSummary.textContent=product?product.name+" • "+product.category+" • "+formatPrice(product.price):"Выберите товар для отзыва.";}select.addEventListener("change",updateSummary);updateSummary();document.getElementById("reviewForm").addEventListener("submit",(event)=>{event.preventDefault();const formData=new FormData(event.target);state.feedbacks.unshift({id:nextId("feedback"),productId:String(formData.get("productId")),buyerId:user.id,rating:Number(formData.get("rating")),message:String(formData.get("message")).trim(),sellerReply:"",createdAt:new Date().toISOString()});saveState(state);document.getElementById("successBox").classList.remove("hidden");setTimeout(()=>{window.location.href="buyer.html";},900);});}</script>
</body></html>
